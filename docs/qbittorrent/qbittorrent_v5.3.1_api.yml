        proxy_peer_connections: {type: boolean, x-webui: Connection › Proxy Server › Use proxy for BitTorrent purposes › Use proxy for peer connections}
        proxy_rss: {type: boolean, x-webui: Connection › Proxy Server › Use proxy for RSS purposes}
        proxy_misc: {type: boolean, x-webui: Connection › Proxy Server › Use proxy for general purposes}
