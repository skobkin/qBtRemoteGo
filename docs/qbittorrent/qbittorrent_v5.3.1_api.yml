        alt_dl_limit: {type: integer, minimum: 0, x-unit: bytes/s, x-webui-unit: KiB/s, description: 0 = unlimited., x-webui: Speed › Alternative Rate Limits › Download}
        scheduler_enabled: {type: boolean, x-webui: Speed › Alternative Rate Limits › Schedule the use of alternative rate limits}
        schedule_from_hour: {type: integer, minimum: 0, maximum: 23, description: Applied only together with schedule_from_min in the same request., x-webui: Speed › Schedule › From (hours)}
        schedule_from_min: {type: integer, minimum: 0, maximum: 59, description: Applied only together with schedule_from_hour., x-webui: Speed › Schedule › From (minutes)}
        schedule_to_hour: {type: integer, minimum: 0, maximum: 23, description: Applied only together with schedule_to_min., x-webui: Speed › Schedule › To (hours)}
        schedule_to_min: {type: integer, minimum: 0, maximum: 59, description: Applied only together with schedule_to_hour., x-webui: Speed › Schedule › To (minutes)}
