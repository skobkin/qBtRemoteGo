    Preferences:
      type: object
      description: |
        All application preferences (WebAPI 2.16.2). Every key is readable and writable
        unless noted (`readOnly` / `writeOnly`). Keys appear in the order of
        `preferencesAction()`, which follows the WebUI tabs.

        WebUI controls that are stored only in the browser (not in this object): the
        Behavior tab's color scheme, display density, date format, alternating row colors,
        double-click actions, auto hide zero status filters and the "Custom WebUI settings".
      additionalProperties: true
      properties:
        # ---------------------------------------------------------------- Behavior
        locale: {type: string, description: UI language, e.g. en or en_GB., x-webui: Behavior › Localization › User interface language}
        performance_warning: {type: boolean, x-webui: Behavior › Log performance warnings}
        status_bar_external_ip: {type: boolean, x-webui: Behavior › Status bar › Show external IP}
        confirm_torrent_deletion: {type: boolean, x-webui: Behavior › Transfer List › Confirm when deleting torrents}
        store_search_jobs: {type: boolean, x-since: 2.16.1, x-webui: Behavior › Search › Save search tabs}
        store_search_job_results: {type: boolean, x-since: 2.16.1, x-webui: Behavior › Search › Also save search results}
        file_log_enabled: {type: boolean, x-webui: Behavior › Log Files (checkbox)}
        file_log_path: {type: string, description: Server path., x-webui: Behavior › Log Files › Save path}
        file_log_backup_enabled: {type: boolean, x-webui: Behavior › Log Files › Backup the log file after}
        file_log_max_size: {type: integer, x-unit: KiB, x-webui: Behavior › Log Files › Backup the log file after (value)}
        file_log_delete_old: {type: boolean, x-webui: Behavior › Log Files › Delete backup logs older than}
        file_log_age: {type: integer, x-webui: Behavior › Log Files › Delete backup logs older than (value)}
        file_log_age_type: {type: integer, enum: [0, 1, 2], x-enum-names: [days, months, years], x-webui: Behavior › Log Files › Delete backup logs older than (unit)}
        delete_torrent_content_files: {type: boolean, description: Default of "also delete files" when removing torrents (desktop GUI)., x-webui: (not shown)}

        # ---------------------------------------------------------------- Downloads
        torrent_content_layout: {type: string, enum: [Original, Subfolder, NoSubfolder], x-webui: Downloads › When adding a torrent › Torrent content layout}
        # wiki deviation: the wiki lists create_subfolder_enabled and start_paused_enabled, which 5.3.1 no longer has.
        add_to_top_of_queue: {type: boolean, x-webui: Downloads › When adding a torrent › Add to top of queue}
        add_stopped_enabled: {type: boolean, x-webui: Downloads › When adding a torrent › Do not start the download automatically}
        torrent_stop_condition: {type: string, enum: [None, MetadataReceived, FilesChecked], x-webui: Downloads › When adding a torrent › Torrent stop condition}
        merge_trackers: {type: boolean, x-webui: Downloads › When adding a duplicate torrent › Merge trackers to existing torrent}
        auto_delete_mode:
          type: integer
          enum: [0, 1, 2]
          x-enum-names: [Never, If added, Always (also when addition is cancelled)]
          x-webui: Downloads › When adding a torrent › Delete .torrent files afterwards / Also when addition is cancelled
          # wiki deviation: the wiki marks this TODO.
        preallocate_all: {type: boolean, x-webui: Downloads › Pre-allocate disk space for all files}
        incomplete_files_ext: {type: boolean, x-webui: Downloads › Append .!qB extension to incomplete files}
        use_unwanted_folder: {type: boolean, x-webui: Downloads › Keep unselected files in ".unwanted" folder}
        auto_tmm_enabled: {type: boolean, description: true = Automatic, false = Manual., x-webui: Downloads › Saving Management › Default Torrent Management Mode}
        torrent_changed_tmm_enabled: {type: boolean, description: true = Relocate torrent, false = Switch torrent to Manual Mode., x-webui: Downloads › Saving Management › When Torrent Category changed}
        save_path_changed_tmm_enabled: {type: boolean, description: true = Relocate affected torrents, false = Switch affected torrents to Manual Mode., x-webui: Downloads › Saving Management › When Default Save Path changed}
        category_changed_tmm_enabled: {type: boolean, description: Same choice as above., x-webui: Downloads › Saving Management › When Category Save Path changed}
        use_category_paths_in_manual_mode: {type: boolean, x-webui: Downloads › Saving Management › Use Category paths in Manual Mode}
        save_path: {type: string, description: Server path., x-webui: Downloads › Saving Management › Default Save Path}
        temp_path_enabled: {type: boolean, x-webui: Downloads › Saving Management › Use another path for incomplete torrents}
        temp_path: {type: string, description: Server path., x-webui: Downloads › Saving Management › Use another path for incomplete torrents (path)}
        # wiki deviation: export_dir/export_dir_fin were removed (2.16.0) and replaced by the torrent_files_backup_* keys.
        torrent_files_backup_enabled: {type: boolean, x-webui: Downloads › Store backup .torrent file › Store backup in}
        torrent_files_backup_dir: {type: string, x-webui: Downloads › Store backup .torrent file › Store backup in (path)}
        torrent_files_finished_backup_dir_enabled: {type: boolean, x-webui: Downloads › Store backup .torrent file › When torrent finished move backup to}
        torrent_files_finished_backup_dir: {type: string, x-webui: Downloads › Store backup .torrent file › When torrent finished move backup to (path)}
        remove_torrent_file_backup: {type: boolean, x-webui: Downloads › Store backup .torrent file › Remove backup when removing torrent}
        scan_dirs:
          type: object
          deprecated: true
          description: |
            Monitored folders: watched folder → 0 (save into the watched folder), 1 (default
            save path) or a custom save path string. Setting it replaces the whole set
            (folders not listed are removed). Deprecated in the source ("delete once replaced
            by updated API method").
          additionalProperties: {oneOf: [{type: integer, enum: [0, 1]}, {type: string}]}
          x-webui: Downloads › Automatically add torrents from
        excluded_file_names_enabled: {type: boolean, x-webui: Downloads › Excluded file names (checkbox)}
        excluded_file_names: {type: string, description: Newline-separated patterns., x-webui: Downloads › Excluded file names}
        mail_notification_enabled: {type: boolean, x-webui: Downloads › Email notification upon download completion (checkbox)}
        mail_notification_sender: {type: string, x-webui: Downloads › Email notification › From}
        mail_notification_email: {type: string, x-webui: Downloads › Email notification › To}
        mail_notification_smtp: {type: string, x-webui: Downloads › Email notification › SMTP server}
        mail_notification_encryption_type: {type: string, enum: [None, STARTTLS, SMTPS], x-since: 2.16.0, x-webui: Downloads › Email notification › SMTP encryption}
        # wiki deviation: mail_notification_ssl_enabled was replaced by mail_notification_encryption_type.
        mail_notification_auth_enabled: {type: boolean, x-webui: Downloads › Email notification › Authentication (checkbox)}
        mail_notification_username: {type: string, x-webui: Downloads › Email notification › Authentication › Username}
        mail_notification_password: {type: string, description: Returned in clear text., x-webui: Downloads › Email notification › Authentication › Password}
        autorun_on_torrent_added_enabled: {type: boolean, x-webui: Downloads › Run external program › Run on torrent added}
        autorun_on_torrent_added_program: {type: string, description: Trimmed by the server., x-webui: Downloads › Run external program › Run on torrent added (command)}
        autorun_enabled: {type: boolean, x-webui: Downloads › Run external program › Run on torrent finished}
        autorun_program: {type: string, description: "Trimmed by the server. Placeholders %N %L %G %F %R %D %C %Z %T %I %J %K %M.", x-webui: Downloads › Run external program › Run on torrent finished (command)}

        # ---------------------------------------------------------------- Connection
        bittorrent_protocol: {type: integer, enum: [0, 1, 2], x-enum-names: [TCP and µTP, TCP, µTP], x-webui: Connection › Peer connection protocol}
        listen_port: {type: integer, minimum: 0, maximum: 65535, description: 0 = random port., x-webui: Connection › Listening Port › Port used for incoming connections}
        random_port: {type: boolean, deprecated: true, description: Read = (listen_port == 0). Writing true sets the port to 0 and wins over listen_port., x-webui: (not shown; the "Random" button just generates a number)}
        ssl_enabled: {type: boolean, description: SSL torrents listening., x-webui: (not shown)}
        ssl_listen_port: {type: integer, x-webui: (not shown)}
        upnp: {type: boolean, x-webui: Connection › Listening Port › Use UPnP / NAT-PMP port forwarding from my router}
        max_connec: {type: integer, description: -1 = unlimited (WebUI checkbox unchecked)., x-webui: Connection › Connections Limits › Global maximum number of connections}
        max_connec_per_torrent: {type: integer, description: -1 = unlimited., x-webui: Connection › Connections Limits › Maximum number of connections per torrent}
        max_uploads: {type: integer, description: -1 = unlimited., x-webui: Connection › Connections Limits › Global maximum number of upload slots}
        max_uploads_per_torrent: {type: integer, description: -1 = unlimited., x-webui: Connection › Connections Limits › Maximum number of upload slots per torrent}
        i2p_enabled: {type: boolean, x-webui: Connection › I2P (Experimental) (checkbox)}
        i2p_address: {type: string, x-webui: Connection › I2P › Host}
        i2p_port: {type: integer, x-webui: Connection › I2P › Port}
        i2p_mixed_mode: {type: boolean, x-webui: Connection › I2P › Mixed mode}
        i2p_pex_enabled: {type: boolean, x-requires-restart: true, x-since: 2.16.2, x-webui: Connection › I2P › Enable I2P Peer Exchange (I2P PeX)}
        i2p_inbound_quantity: {type: integer, x-webui: Advanced › libtorrent › I2P inbound quantity}
        i2p_outbound_quantity: {type: integer, x-webui: Advanced › libtorrent › I2P outbound quantity}
        i2p_inbound_length: {type: integer, x-webui: Advanced › libtorrent › I2P inbound length}
        i2p_outbound_length: {type: integer, x-webui: Advanced › libtorrent › I2P outbound length}
        i2p_inbound_length_variance: {type: integer, x-since: 2.16.2, x-webui: Advanced › libtorrent › I2P inbound length variance}
        i2p_outbound_length_variance: {type: integer, x-since: 2.16.2, x-webui: Advanced › libtorrent › I2P outbound length variance}
        proxy_type:
          type: string
          enum: [None, HTTP, SOCKS5, SOCKS4]
