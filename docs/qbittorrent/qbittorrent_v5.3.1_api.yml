openapi: 3.1.0
info:
  title: qBittorrent WebUI API (as used by qBtRemoteGo)
  version: "2.16.2"
  description: |
    Reference for the qBittorrent WebAPI **2.16.2** (qBittorrent **5.3.1**), cached for
    qBtRemoteGo development.

    **Source of truth:** the qBittorrent source at tag `release-5.3.1`, mainly
    `src/webui/api/*controller.cpp`, `src/webui/api/serialize/`, `src/webui/webapplication.{h,cpp}`
    and `WebAPI_Changelog.md`. The official wiki page
    (https://github.com/qbittorrent/qBittorrent/wiki/WebUI-API-(qBittorrent-5.0)) was used as a
    secondary reference for wording only. Where the wiki deviates from the source, this
    file describes the source; deviations are marked with `# wiki deviation:` comments.

    **Scope:** the endpoints qBtRemoteGo calls (`internal/qbt/client.go`) plus the
    complete application preferences schema. Endpoints are added here when the app
    starts using them.

    **Updating for a new qBittorrent release:**
    1. Read `WebAPI_Changelog.md` entries newer than the version above.
    2. Re-read `AppController::preferencesAction()` / `setPreferencesAction()` in
       `src/webui/api/appcontroller.cpp` and diff the key lists against `Preferences`.
    3. Check `src/webui/webapplication.h` for HTTP method restrictions of used endpoints.
    4. Update `info.version`, the file name and the `x-since` markers.

    **Conventions used here:**
    - `x-webui`: where the key appears in the WebUI Options window
      (`Tab › Section › Label`). `(not shown)` = no WebUI control.
    - `x-unit`: unit on the wire. `x-webui-unit`: unit the WebUI shows when it differs
      (the WebUI converts).
    - `x-requires-restart`: the server applies the value only after restart.
    - `x-enum-names`: meaning of integer enum values, in `enum` order.
    - `x-since`: WebAPI version that added the key, when known.

    **Transport and errors:**
    - Base path `/api/v2/<controller>/<action>`.
    - Actions restricted to POST in `webapplication.h` return **405** on GET. Every other
      action accepts GET or POST. qBtRemoteGo uses GET for reads and POST for writes.
    - API errors map to: BadParams 400, Unauthorized 401, AccessDenied 403, NotFound 404,
      Conflict 409, BadData 415. The error body is plain text.
    - Unauthenticated requests get 403. API-key requests to `auth/*` also get 403.

    **`app/setPreferences` semantics** (important for clients):
    - The body is form field `json` = a JSON object holding only the keys to change.
    - Keys are applied one by one in source order; unknown keys are silently ignored.
    - **Not atomic.** `web_ui_username` and `web_ui_password` validation throws 400 midway;
      keys applied before the error stay applied (in memory and in the session, while
      `pref->apply()` is skipped). Always re-read the preferences after an error.
    - **Paired keys.** `schedule_from_hour` + `schedule_from_min` (and the `_to_` pair) are
      applied only when **both** keys of the pair are present in the same request.
    - **Coupled keys.** `random_port: true` wins over `listen_port`. `max_*_enabled: false`
      wins over the matching value key.
    - The server normalises some values (e.g. speed limits are stored in whole KiB), so a
      re-read can differ from what was sent.
    - There is no revision/ETag. Concurrent edits can only be detected by re-reading.
servers:
  - url: "{baseUrl}/api/v2"
    variables:
      baseUrl:
        default: http://localhost:8080
security:
  - cookieSession: []
  - apiKey: []
tags:
  - name: auth
  - name: app
  - name: sync
  - name: transfer
  - name: torrents

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Start a cookie session
      description: |
        POST only. Sets the session cookie `QBT_SID_<webui port>`.
        CSRF protection requires `Referer`/`Origin` to match `Host` (not checked for
        API-key requests). If a session already exists, the call succeeds immediately.
        # wiki deviation: the wiki says cookie name `SID` and failed login = 200 "Fails.";
        # 5.3.1 uses `QBT_SID_<port>` and failed login = 401.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "200": {description: Logged in (or already logged in).}
        "401": {description: Wrong credentials.}
        "403": {description: Client IP banned after too many failed attempts.}

  /app/version:
    get:
      tags: [app]
      summary: qBittorrent version
      responses:
        "200":
          description: Plain text, e.g. `v5.3.1`.
          content: {text/plain: {schema: {type: string}}}

  /app/defaultSavePath:
    get:
      tags: [app]
      summary: Default save path (server filesystem)
      responses:
        "200":
          description: Plain text path.
          content: {text/plain: {schema: {type: string}}}

  /app/getDirectoryContent:
    get:
      tags: [app]
      summary: List a directory on the server
      description: Used for remote path autocomplete. # wiki deviation: not documented in the wiki.
      parameters:
        - {name: dirPath, in: query, required: true, schema: {type: string}, description: Absolute path on the server.}
        - {name: mode, in: query, schema: {type: string, enum: [all, dirs, files], default: all}}
        - {name: withMetadata, in: query, schema: {type: boolean, default: false}, description: Return objects (name, dates, size…) instead of plain paths.}
      responses:
        "200":
          description: Array of absolute paths (strings), or metadata objects with `withMetadata`.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        "400": {description: Invalid directory path or mode.}
        "404": {description: Directory does not exist.}

  /app/preferences:
    get:
      tags: [app]
      summary: Read all application preferences
      description: |
        Returns every key in `Preferences` (unlike the wiki's claim, 5.3.1 always returns the
        full set). Secrets such as `proxy_password`, `mail_notification_password`,
        `dyndns_password` and `web_ui_api_key` are returned in clear text; `web_ui_password`
        is never returned.
      responses:
        "200":
          description: Preferences object.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}

  /app/setPreferences:
    post:
      tags: [app]
      summary: Change application preferences
      description: POST only. See `info.description` for the non-atomic semantics.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [json]
              properties:
                json:
                  type: string
                  description: JSON object with the subset of `Preferences` keys to change.
                  example: '{"dl_limit":1048576,"scheduler_enabled":true}'
      responses:
        "200": {description: Applied (unknown keys ignored). Empty body.}
        "400": {description: A validated key was rejected (plain-text reason). Earlier keys are already applied.}

  /app/rotateAPIKey:
    post:
      tags: [app]
      summary: Generate or rotate the WebAPI key
      description: |
        POST only (WebAPI 2.14.1+). Generates a new `qbt_` key (32 characters) and stores it as
        `web_ui_api_key`, replacing any existing key; the old key stops authenticating
        immediately. `web_ui_api_key` itself is read-only: `setPreferences` ignores it.
        The companion `app/deleteAPIKey` (2.14.1+, POST, empty 200) removes the key; this
        client does not use it.
      responses:
        "200":
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey]
                properties:
                  apiKey: {type: string, example: qbt_0123456789abcdefghijklmnopqr}

  /sync/maindata:
    get:
      tags: [sync]
      summary: Incremental snapshot of torrents, categories, tags and server state
      parameters:
        - {name: rid, in: query, schema: {type: integer, default: 0}, description: Last response id; 0 = full update.}
      responses:
        "200":
          description: Main data.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MainData"}

  /sync/torrentPeers:
    get:
      tags: [sync]
      summary: Incremental peer list of one torrent
      parameters:
        - {name: hash, in: query, required: true, schema: {type: string}}
        - {name: rid, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: |
            Object with `rid`, `full_update`, `show_flags`, `peers` (map "ip:port" → Peer) and
            `peers_removed` (array of keys).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TorrentPeers"}
        "404": {description: Torrent not found.}

  /transfer/info:
    get:
      tags: [transfer]
      summary: Global transfer info
      responses:
        "200":
          description: Transfer info.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransferInfo"}

  /transfer/toggleSpeedLimitsMode:
    post:
      tags: [transfer]
      summary: Toggle alternative ("slow mode") speed limits
      description: POST only.
      responses:
        "200": {description: Toggled.}

  /torrents/info:
    get:
      tags: [torrents]
      summary: List torrents
      parameters:
        - {name: filter, in: query, schema: {type: string, enum: [all, downloading, seeding, completed, stopped, running, active, inactive, stalled, stalled_uploading, stalled_downloading, checking, moving, errored]}}
        - {name: category, in: query, schema: {type: string}, description: Empty string = uncategorised; absent = any.}
        - {name: tag, in: query, schema: {type: string}, description: Empty string = untagged; absent = any.}
        - {name: sort, in: query, schema: {type: string}, description: Any Torrent field name; 400 if invalid.}
        - {name: reverse, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer}}
        - {name: hashes, in: query, schema: {type: string}, description: "`|`-separated."}
        - {name: private, in: query, schema: {type: boolean}}
        - {name: includeFiles, in: query, schema: {type: boolean}}
        - {name: includeTrackers, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Torrents.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Torrent"}
        "400": {description: Invalid sort parameter.}

  /torrents/properties:
    get:
      tags: [torrents]
      summary: Generic properties of one torrent
      parameters:
        - {name: hash, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Properties.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TorrentProperties"}
        "404": {description: Torrent not found.}

  /torrents/trackers:
    get:
      tags: [torrents]
      summary: Trackers of one torrent (first three rows are DHT, PeX, LSD pseudo-trackers)
      parameters:
        - {name: hash, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Trackers.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Tracker"}
        "404": {description: Torrent not found.}

  /torrents/webseeds:
    get:
      tags: [torrents]
      summary: Web seeds of one torrent
      parameters:
        - {name: hash, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Web seeds.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    url: {type: string}
        "404": {description: Torrent not found.}

  /torrents/files:
    get:
      tags: [torrents]
      summary: Files of one torrent
      parameters:
        - {name: hash, in: query, required: true, schema: {type: string}}
        - {name: indexes, in: query, schema: {type: string}, description: "`|`-separated file indexes."}
      responses:
        "200":
          description: Files; an empty array when metadata is not available yet.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TorrentFile"}
        "404": {description: Torrent not found.}
        "409": {description: Invalid or out-of-bounds index.}

  /torrents/categories:
    get:
      tags: [torrents]
      summary: All categories
      responses:
        "200":
          description: Map of category name → Category.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/Category"}

  /torrents/tags:
    get:
      tags: [torrents]
      summary: All tags
      responses:
        "200":
          description: Tag names.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}

  /torrents/add:
    post:
      tags: [torrents]
      summary: Add torrents from URLs/magnets and/or .torrent files
      description: POST only, `multipart/form-data`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                urls: {type: string, description: Newline-separated URLs / magnet links.}
                torrents: {type: string, format: binary, description: .torrent file content; may repeat.}
                savepath: {type: string}
                downloadPath: {type: string}
                useDownloadPath: {type: boolean}
                category: {type: string}
                tags: {type: string, description: Comma-separated.}
                rename: {type: string}
                upLimit: {type: integer, x-unit: bytes/s}
                dlLimit: {type: integer, x-unit: bytes/s}
                ratioLimit: {type: number}
                seedingTimeLimit: {type: integer, x-unit: minutes}
                inactiveSeedingTimeLimit: {type: integer, x-unit: minutes}
                shareLimitAction: {type: string, enum: [Default, Stop, Remove, RemoveWithContent, EnableSuperSeeding]}
                shareLimitsMode: {type: string, enum: [Default, MatchAny, MatchAll]}
                autoTMM: {type: boolean}
                stopped: {type: boolean, description: "# wiki deviation: the wiki names it `paused`."}
                stopCondition: {type: string, enum: [None, MetadataReceived, FilesChecked]}
                contentLayout: {type: string, enum: [Original, Subfolder, NoSubfolder], description: "# wiki deviation: replaces `root_folder`."}
                addToTopOfQueue: {type: boolean}
                forced: {type: boolean}
                seedMode: {type: boolean, description: Skip hash checking.}
                sequentialDownload: {type: boolean}
                firstLastPiecePrio: {type: boolean}
                filePriorities: {type: string, description: Comma-separated priorities; single magnet with known metadata only.}
      responses:
        "200":
          description: |
            JSON result. # wiki deviation: the wiki says plain "Ok."/"Fails."; 5.3.1 returns an object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_count: {type: integer}
                  failure_count: {type: integer}
                  pending_count: {type: integer}
                  added_torrent_ids: {type: array, items: {type: string}}
        "202": {description: Some torrents are still pending (metadata download); same body.}
        "400": {description: Invalid parameter.}
        "409": {description: Nothing could be added.}
        "415": {description: Not a valid torrent file.}

  /torrents/delete:
    post:
      tags: [torrents]
      summary: Remove torrents
      description: POST only.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes, deleteFiles]
              properties:
                hashes: {type: string, description: "`|`-separated or `all`."}
                deleteFiles: {type: boolean}
      responses:
        "200": {description: Removed.}

  /torrents/start:
    post:
      tags: [torrents]
      summary: Start (resume) torrents
      description: "POST only. # wiki deviation: older wiki/API names this `resume`."
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Started.}

  /torrents/stop:
    post:
      tags: [torrents]
      summary: Stop (pause) torrents
      description: "POST only. # wiki deviation: older wiki/API names this `pause`."
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Stopped.}

  /torrents/recheck:
    post:
      tags: [torrents]
      summary: Force recheck
      description: POST only.
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Queued.}

  /torrents/reannounce:
    post:
      tags: [torrents]
      summary: Force reannounce
      description: POST only. Optional `urls` (`|`-separated) restricts it to specific trackers.
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Reannounced.}

  /torrents/setLocation:
    post:
      tags: [torrents]
      summary: Move torrents to another save path (server filesystem)
      description: POST only.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes, location]
              properties:
                hashes: {type: string}
                location: {type: string, description: Created if missing.}
      responses:
        "200": {description: Moving.}
        "400": {description: Empty save path.}
        "409": {description: Cannot create the directory.}

  /torrents/rename:
    post:
      tags: [torrents]
      summary: Rename a torrent
      description: POST only.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hash, name]
              properties:
                hash: {type: string}
                name: {type: string}
      responses:
        "200": {description: Renamed.}
        "404": {description: Torrent not found.}
        "409": {description: Empty/incorrect name.}

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: QBT_SID_8080
      description: Session cookie from `auth/login`; the name is `QBT_SID_<webui port>`.
    apiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer qbt_…` (WebUI API key, `web_ui_api_key`). There are no scopes:
        a key session has full access, the same as a logged-in user. CSRF checks are skipped.
        # wiki deviation: API keys are not documented in the 5.0 wiki.

  requestBodies:
    Hashes:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [hashes]
            properties:
              hashes: {type: string, description: "`|`-separated hashes or `all`."}

  schemas:
    Category:
      type: object
      properties:
        name: {type: string}
        savePath: {type: string}
        downloadPath: {description: "Path string when the category overrides it, `false` when explicitly disabled, `null` when it follows the global setting."}

    TransferInfo:
      type: object
      properties:
        dl_info_speed: {type: integer, x-unit: bytes/s}
        dl_info_data: {type: integer, x-unit: bytes, description: Downloaded this session.}
        up_info_speed: {type: integer, x-unit: bytes/s}
        up_info_data: {type: integer, x-unit: bytes}
        dl_rate_limit: {type: integer, x-unit: bytes/s, description: Currently effective limit; 0 = unlimited.}
        up_rate_limit: {type: integer, x-unit: bytes/s}
        dht_nodes: {type: integer}
        connection_status: {type: string, enum: [connected, firewalled, disconnected]}

    ServerState:
      description: "`server_state` of sync/maindata. Incremental: only changed keys after the first response."
      type: object
      properties:
        dl_info_speed: {type: integer, x-unit: bytes/s}
        dl_info_data: {type: integer, x-unit: bytes}
        up_info_speed: {type: integer, x-unit: bytes/s}
        up_info_data: {type: integer, x-unit: bytes}
        dl_rate_limit: {type: integer, x-unit: bytes/s}
        up_rate_limit: {type: integer, x-unit: bytes/s}
        dht_nodes: {type: integer}
        connection_status: {type: string, enum: [connected, firewalled, disconnected]}
        free_space_on_disk: {type: integer, x-unit: bytes, description: Free space at the default save path.}
        use_alt_speed_limits: {type: boolean}
        queueing: {type: boolean}
        refresh_interval: {type: integer, x-unit: ms}
        alltime_dl: {type: integer, x-unit: bytes}
        alltime_ul: {type: integer, x-unit: bytes}
        total_wasted_session: {type: integer, x-unit: bytes}
        global_ratio: {type: string}
        total_peer_connections: {type: integer}
        queued_io_jobs: {type: integer}
        average_time_queue: {type: integer, x-unit: ms}
        total_buffers_size: {type: integer, x-unit: bytes}
        total_queued_size: {type: integer, x-unit: bytes}
        read_cache_hits: {type: string}
        read_cache_overload: {type: string}
        write_cache_overload: {type: string}
        queued_tracker_announces: {type: integer}
        last_external_address_v4: {type: string}
        last_external_address_v6: {type: string}

    MainData:
      type: object
      properties:
        rid: {type: integer}
        full_update: {type: boolean}
        torrents: {type: object, additionalProperties: {$ref: "#/components/schemas/Torrent"}, description: hash → (partial) Torrent.}
        torrents_removed: {type: array, items: {type: string}}
        categories: {type: object, additionalProperties: {$ref: "#/components/schemas/Category"}}
        categories_removed: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        tags_removed: {type: array, items: {type: string}}
        trackers: {type: object, additionalProperties: {type: array, items: {type: string}}, description: tracker URL → hashes.}
        trackers_removed: {type: array, items: {type: string}}
        server_state: {$ref: "#/components/schemas/ServerState"}

    TorrentPeers:
      type: object
      properties:
        rid: {type: integer}
        full_update: {type: boolean}
        show_flags: {type: boolean}
        peers:
          type: object
          additionalProperties:
            type: object
            properties:
              ip: {type: string}
              port: {type: integer}
              client: {type: string}
              peer_id_client: {type: string}
              connection: {type: string}
              country: {type: string}
              country_code: {type: string}
              flags: {type: string}
              flags_desc: {type: string}
              host_name: {type: string}
              progress: {type: number, description: 0..1}
              dl_speed: {type: integer, x-unit: bytes/s}
              up_speed: {type: integer, x-unit: bytes/s}
              downloaded: {type: integer, x-unit: bytes}
              uploaded: {type: integer, x-unit: bytes}
              relevance: {type: number}
              files: {type: string}
        peers_removed: {type: array, items: {type: string}}

    Torrent:
      type: object
      properties:
        hash: {type: string, description: Torrent ID (v1 hash, or truncated v2 for v2-only torrents).}
        infohash_v1: {type: string}
        infohash_v2: {type: string}
        name: {type: string}
        has_metadata: {type: boolean}
        private: {type: [boolean, "null"], description: "null without metadata. # wiki deviation: the wiki names it `isPrivate`."}
        created_by: {type: string}
        creation_date: {type: integer, x-unit: unix seconds}
        comment: {type: string}
        magnet_uri: {type: string}
        size: {type: integer, x-unit: bytes, description: Selected files.}
        total_size: {type: integer, x-unit: bytes, description: All files.}
        pieces_num: {type: integer}
        piece_size: {type: integer, x-unit: bytes}
        pieces_have: {type: integer}
        progress: {type: number, description: 0..1}
        total_wasted: {type: integer, x-unit: bytes}
        dlspeed: {type: integer, x-unit: bytes/s}
        upspeed: {type: integer, x-unit: bytes/s}
        priority: {type: integer, description: Queue position (1-based); 0 when not queued.}
        num_seeds: {type: integer}
        num_complete: {type: integer}
        num_leechs: {type: integer}
        num_incomplete: {type: integer}
        ratio: {type: number, description: Capped at 9999 (shown as ∞).}
        popularity: {type: number}
        eta: {type: integer, x-unit: seconds, description: 8640000 = infinity.}
        state:
          type: string
          # wiki deviation: 5.x renamed pausedUP/pausedDL to stoppedUP/stoppedDL and added forcedMetaDL.
          enum: [error, missingFiles, uploading, stoppedUP, queuedUP, stalledUP, checkingUP, forcedUP, downloading, metaDL, forcedMetaDL, stoppedDL, queuedDL, stalledDL, checkingDL, forcedDL, checkingResumeData, moving, unknown]
        seq_dl: {type: boolean}
        f_l_piece_prio: {type: boolean}
        category: {type: string}
        tags: {type: string, description: "Tags joined with \", \"."}
        super_seeding: {type: boolean}
        force_start: {type: boolean}
        save_path: {type: string}
