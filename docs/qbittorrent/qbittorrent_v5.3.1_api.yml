          # enum names, and authentication is the separate proxy_auth_enabled flag.
        proxy_ip: {type: string, x-webui: Connection › Proxy Server › Host}
        proxy_port: {type: integer, x-webui: Connection › Proxy Server › Port}
        proxy_hostname_lookup: {type: boolean, x-webui: Connection › Proxy Server › Perform hostname lookup via proxy}
        proxy_auth_enabled: {type: boolean, x-webui: Connection › Proxy Server › Authentication (checkbox)}
        proxy_username: {type: string, x-webui: Connection › Proxy Server › Authentication › Username}
        proxy_password: {type: string, description: Returned in clear text; stored unencrypted on the server., x-webui: Connection › Proxy Server › Authentication › Password}
