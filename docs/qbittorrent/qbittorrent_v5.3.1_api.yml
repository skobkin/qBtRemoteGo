        max_active_uploads: {type: integer, description: -1 = unlimited., x-webui: BitTorrent › Torrent Queueing › Maximum active uploads}
        max_active_torrents: {type: integer, description: -1 = unlimited., x-webui: BitTorrent › Torrent Queueing › Maximum active torrents}
        dont_count_slow_torrents: {type: boolean, x-webui: BitTorrent › Torrent Queueing › Do not count slow torrents in these limits}
        slow_torrent_dl_rate_threshold: {type: integer, x-unit: KiB/s, x-webui: BitTorrent › Torrent Queueing › Download rate threshold}
        slow_torrent_ul_rate_threshold: {type: integer, x-unit: KiB/s, x-webui: BitTorrent › Torrent Queueing › Upload rate threshold}
        slow_torrent_inactive_timer: {type: integer, x-unit: seconds, x-webui: BitTorrent › Torrent Queueing › Torrent inactivity timer}
        max_ratio_enabled: {type: boolean, description: Read = (max_ratio >= 0). Writing false wins over max_ratio., x-webui: BitTorrent › Seeding Limits › When ratio reaches (checkbox)}
        max_ratio: {type: number, description: -1 when disabled., x-webui: BitTorrent › Seeding Limits › When ratio reaches}
        max_seeding_time_enabled: {type: boolean, x-webui: BitTorrent › Seeding Limits › When total seeding time reaches (checkbox)}
        max_seeding_time: {type: integer, x-unit: minutes, description: -1 when disabled., x-webui: BitTorrent › Seeding Limits › When total seeding time reaches}
        max_inactive_seeding_time_enabled: {type: boolean, x-webui: BitTorrent › Seeding Limits › When inactive seeding time reaches (checkbox)}
