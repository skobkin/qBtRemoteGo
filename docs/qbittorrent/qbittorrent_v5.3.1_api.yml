        add_trackers_from_url_enabled: {type: boolean, x-webui: BitTorrent › Automatically append trackers from URL to new downloads (checkbox)}
        add_trackers_url: {type: string, x-webui: BitTorrent › Automatically append trackers from URL › URL}
        add_trackers_url_list: {type: string, readOnly: true, description: Trackers fetched from add_trackers_url., x-webui: BitTorrent › Automatically append trackers from URL › Fetched trackers}

        # ---------------------------------------------------------------- RSS
        rss_refresh_interval: {type: integer, x-unit: minutes, x-webui: RSS › RSS Reader › Feeds refresh interval}
