# Publishes the qbtremotego AUR package on stable release tags.
#
# Runs only for plain X.Y.Z tags, and only after the `ci` workflow has
# passed for the same commit. The rendered PKGBUILD, its .SRCINFO and the
# 0BSD packaging license files are pushed to ssh://aur@aur.archlinux.org/
# qbtremotego.git (master branch only).
#
# Required Woodpecker secret: AUR_SSH_PRIVATE_KEY — an Ed25519 SSH private
# key whose public part is registered with the AUR account that owns the
# qbtremotego package (see packaging/arch/README.md).
when:
  - event: tag

depends_on:
  - ci

steps:
  validate:
    image: archlinux:base-devel
    commands:
      - |
        set -euo pipefail
        tag_re='^[0-9]+\.[0-9]+\.[0-9]+$'
        if ! [[ "$CI_COMMIT_TAG" =~ $tag_re ]]; then
          echo "ERROR: refusing AUR publication for tag '$CI_COMMIT_TAG': not a stable X.Y.Z release tag" >&2
          exit 1
        fi
        echo "Tag '$CI_COMMIT_TAG' is a stable release tag."

  publish:
    image: archlinux:base-devel
    depends_on:
      - validate
    environment:
      AUR_SSH_PRIVATE_KEY:
        from_secret: AUR_SSH_PRIVATE_KEY
      AUR_GIT_AUTHOR_NAME: Alexey Skobkin
      AUR_GIT_AUTHOR_EMAIL: skobkin@proton.me
    commands:
      - |
        set -euo pipefail
        if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
          echo "ERROR: Woodpecker secret AUR_SSH_PRIVATE_KEY is not set; cannot publish to the AUR" >&2
          exit 1
        fi
        if [ -z "$AUR_GIT_AUTHOR_NAME" ] || [ -z "$AUR_GIT_AUTHOR_EMAIL" ]; then
          echo "ERROR: AUR_GIT_AUTHOR_NAME / AUR_GIT_AUTHOR_EMAIL must not be empty" >&2
          exit 1
        fi
        case "$CI_COMMIT_TIMESTAMP" in
          ''|*[!0-9]*)
            echo "ERROR: CI_COMMIT_TIMESTAMP '$CI_COMMIT_TIMESTAMP' is not a UNIX timestamp" >&2
            exit 1
            ;;
        esac

        # Full sync upgrade: never rely on partial -Sy database state,
        # even in a disposable container.
        pacman -Syu --noconfirm --needed archlinux-keyring curl git go openssh

        # makepkg refuses to run as root; all makepkg/git work below runs
        # as this unprivileged user.
        id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder

        mkdir -p aur/LICENSES
        curl -fsSL --retry 3 -o aur/source.tar "https://git.skobk.in/api/v1/repos/skobkin/qBtRemoteGo/archive/$CI_COMMIT_TAG.tar"
        SHA256=$(sha256sum aur/source.tar | awk '{print $1}')

        # Layout drift guard: the archive must contain a single top-level
        # qbtremotego/ directory (extraction strips it).
        if bsdtar -tf aur/source.tar | grep -qv '^qbtremotego/'; then
          echo "ERROR: source archive layout changed; expected a single top-level qbtremotego/ directory" >&2
          exit 1
        fi
        rm aur/source.tar

        BUILDDATE=$(date -u -d "@$CI_COMMIT_TIMESTAMP" +%Y-%m-%dT%H:%M:%SZ)
        sed -e "s|@PKGVER@|$CI_COMMIT_TAG|g" \
            -e "s|@SHA256SUM@|$SHA256|g" \
            -e "s|@BUILDDATE@|$BUILDDATE|g" \
            packaging/arch/PKGBUILD.in > aur/PKGBUILD
        bash -n aur/PKGBUILD
        cp packaging/arch/LICENSE aur/LICENSE
        cp packaging/arch/REUSE.toml aur/REUSE.toml
        # Arch scheme: LICENSES/0BSD.txt is a symlink to the root LICENSE
        ln -s ../LICENSE aur/LICENSES/0BSD.txt

        # SSH setup for the builder user. The private key is never echoed;
        # the AUR host key is pinned by fingerprint and verification is
        # never disabled.
        install -d -m 700 -o builder -g builder /home/builder/.ssh
        printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/id_ed25519
        chmod 600 /home/builder/.ssh/id_ed25519
        chown builder:builder /home/builder/.ssh/id_ed25519
        ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts 2>/dev/null || true
        if [ ! -s /home/builder/.ssh/known_hosts ]; then
          echo "ERROR: could not fetch the AUR host key with ssh-keyscan" >&2
          exit 1
        fi
        if ! ssh-keygen -lf /home/builder/.ssh/known_hosts | grep -qF 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'; then
          echo "ERROR: AUR host key fingerprint verification failed; refusing to continue" >&2
          echo "keys presented:" >&2
          ssh-keygen -lf /home/builder/.ssh/known_hosts >&2 || true
          exit 1
        fi
        chown builder:builder /home/builder/.ssh/known_hosts

        chown -R builder:builder "$PWD"
      - |
        runuser -u builder -- env HOME=/home/builder bash -c '
          set -euo pipefail
          cd "$1"
          makepkg --printsrcinfo > .SRCINFO
          makepkg --verifysource
          echo "Rendered PKGBUILD and source checksum validated."
        ' runuser "$PWD/aur"
      - |
        runuser -u builder -- env HOME=/home/builder bash -c '
          set -euo pipefail
          cd "$1"
          PKGREL=$(grep -m1 -oP "^pkgrel=\K[0-9]+" PKGBUILD)
          export GIT_AUTHOR_DATE="@$CI_COMMIT_TIMESTAMP +0000"
          export GIT_COMMITTER_DATE="@$CI_COMMIT_TIMESTAMP +0000"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          rm -rf "$HOME/aur-repo"
          git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/qbtremotego.git "$HOME/aur-repo"
          cd "$HOME/aur-repo"
          cp "$1/PKGBUILD" "$1/.SRCINFO" "$1/LICENSE" "$1/REUSE.toml" .
          mkdir -p LICENSES
          ln -s ../LICENSE LICENSES/0BSD.txt
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish: the AUR repository already matches the rendered package."
            exit 0
          fi
          git -c user.name="$AUR_GIT_AUTHOR_NAME" -c user.email="$AUR_GIT_AUTHOR_EMAIL" commit -m "qbtremotego $CI_COMMIT_TAG-$PKGREL"
          git push origin HEAD:master
          echo "Published qbtremotego $CI_COMMIT_TAG-$PKGREL to the AUR."
        ' runuser "$PWD/aur"
